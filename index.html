<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Henry</title>
<meta name="description" content="A quiet little notebook for your mood.">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1d1a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Henry">
<meta name="apple-mobile-web-app-title" content="Henry">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- Entry: the numpad -->
  <section id="view-pad" class="view" aria-label="Log your mood">
    <header class="bar">
      <span class="bar-spacer"></span>
      <button type="button" id="to-log" class="text-btn">Log</button>
    </header>

    <div class="prompt-block">
      <h1 class="prompt">How are you feeling?</h1>
      <p class="hint">1 is low, 10 is great</p>
    </div>

    <div class="pad" role="group" aria-label="Mood from 1 to 10">
        <button type="button" class="key" data-v="1">1</button>
        <button type="button" class="key" data-v="2">2</button>
        <button type="button" class="key" data-v="3">3</button>
        <button type="button" class="key" data-v="4">4</button>
        <button type="button" class="key" data-v="5">5</button>
        <button type="button" class="key" data-v="6">6</button>
        <button type="button" class="key" data-v="7">7</button>
        <button type="button" class="key" data-v="8">8</button>
        <button type="button" class="key" data-v="9">9</button>
        <span class="key-gap" aria-hidden="true"></span>
        <button type="button" class="key" data-v="10">10</button>
        <span class="key-gap" aria-hidden="true"></span>
    </div>
  </section>

  <!-- Log: the notebook page -->
  <section id="view-log" class="view" aria-label="Mood log" hidden>
    <header class="bar">
      <button type="button" id="to-pad" class="text-btn">+ New</button>
      <button type="button" id="edit-toggle" class="text-btn">Edit</button>
    </header>

    <div id="scroller" class="scroller">
      <div class="page">
        <div id="log" class="log"></div>
      </div>
    </div>
  </section>

</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button type="button" id="toast-undo" class="toast-undo">Undo</button>
</div>

<script src="app.js"></script>
</body>
</html>
